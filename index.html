<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexport Velocity Timer - 16:9</title>

<link rel="preload" href="Fonts/ZalandoSans-ExtraLight.ttf" as="font" type="font/ttf" crossorigin>

<style>
@font-face {
  font-family: "ZalandoSans";
  src: url("Fonts/ZalandoSans-ExtraLight.ttf") format("truetype");
  font-weight: 200;
  font-style: normal;
  font-display: swap;
}

/* --- Layout --- */
body {
  margin: 0;
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  overflow: hidden;
  position: relative;
}

.timer-container {
  aspect-ratio: 16 / 9;
  width: 100%;
  max-height: 100vh; 
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  z-index: 2;
  position: relative;
  box-sizing: border-box;
}

#logo {
  width: 42%;
  max-width: 660px;
  min-width: 300px;
  height: auto;
  margin-bottom: 4vh;
}

#timer {
  font-family: 'ZalandoSans', sans-serif;
  font-weight: 200;
  font-size: clamp(80px, 20vw, 380px);
  letter-spacing: -0.04em;
  color: #fff;
  text-align: center;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  -moz-font-feature-settings: 'tnum';
  -webkit-font-feature-settings: 'tnum';
  font-feature-settings: 'tnum';
}

#finalCountdown {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  /* Dark background to make the big numbers pop */
  background: #000;
  font-family: "ZalandoSans", sans-serif;
  font-weight: 200;
  letter-spacing: -0.04em;
  font-size: clamp(100px, 45vw, 850px);
  color: transparent;
  background: linear-gradient(180deg, #028DAC 44%, #FFFFFF 100%);
  -webkit-background-clip: text;
  background-clip: text;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

/* --- Animations --- */
@keyframes numberPulse {
  0%   { transform: scale(0.8); opacity: 0; }
  20%  { transform: scale(1);   opacity: 1; }
  50%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1.05); opacity: 0; }
}

@keyframes glowPulse {
  0%   { box-shadow: inset 0 0 0px 0px rgba(2,141,172,0); }
  20%  { box-shadow: inset 0 0 80px 5px rgba(2,141,172,0.9); }
  50%  { box-shadow: inset 0 0 100px 5px rgba(2,141,172,1); }
  100% { box-shadow: inset 0 0 0px 0px rgba(2,141,172,0); }
}

.animate-number { animation: numberPulse 1s linear forwards; }
.animate-glow   { animation: glowPulse 1s linear forwards; }

@keyframes fadeToBlack {
  0% { opacity: 1; }
  100% { opacity: 0; }
}
</style>
</head>
<body>
  <div class="timer-container" id="mainContent">
    <img id="logo" src="Images/Momentum_Logo_Reverse_Single_Line.svg" alt="Momentum">
    <div id="timer">00:00:00</div>
  </div>

  <div id="finalCountdown"></div>

<script>
const params = new URLSearchParams(window.location.search);

let hours   = params.has("hours")   ? parseInt(params.get("hours"))   || 0 : 0;
let minutes = params.has("minutes") ? parseInt(params.get("minutes")) || 0 : 0;
let seconds = params.has("seconds") ? parseInt(params.get("seconds")) || 0 : 0;

let endISO = params.get("end");
let endTime = endISO ? new Date(endISO) : null;

if (!params.has("hours") && !params.has("minutes") && !params.has("seconds") && !endTime) {
  minutes = 10; 
}

const autoStart = params.get("autostart") === "true";

let duration, timeRemaining;

function computeDuration() {
  if (endTime) {
    const now = new Date();
    duration = Math.floor((endTime - now) / 1000);
    if (duration < 0) duration = 0;
  } else {
    duration = hours * 3600 + minutes * 60 + seconds;
  }
  timeRemaining = duration;
}

computeDuration();

const timerDisplay   = document.getElementById("timer");
const mainContent    = document.getElementById("mainContent");
const finalCountdown = document.getElementById("finalCountdown");
const bodyEl         = document.body;

let timerInterval = null;

function updateDisplay() {
  let mins = Math.floor(timeRemaining / 60);
  let secs = timeRemaining % 60;
  let hrs  = Math.floor(mins / 60);
  mins = mins % 60;

  timerDisplay.textContent =
    String(hrs).padStart(2, "0") + ":" +
    String(mins).padStart(2, "0") + ":" +
    String(secs).padStart(2, "0");
}

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    if (endTime) {
      computeDuration();
    } else {
      if (timeRemaining > 0) timeRemaining--;
    }

    if (timeRemaining > 10) {
      updateDisplay();
    } else if (timeRemaining <= 10 && timeRemaining > 0) {
      mainContent.style.display = "none";
      showBigNumber(timeRemaining);
    } else {
      clearInterval(timerInterval);
      timerInterval = null;
      endSequence();
    }
  }, 1000);
}

function showBigNumber(n) {
    finalCountdown.textContent = n;
    finalCountdown.style.opacity = "1";

    finalCountdown.classList.remove("animate-number");
    bodyEl.classList.remove("animate-glow");
    void finalCountdown.offsetWidth; 
    void bodyEl.offsetWidth;
    finalCountdown.classList.add("animate-number");
    bodyEl.classList.add("animate-glow");
}

function endSequence() {
  finalCountdown.textContent = "";
  finalCountdown.style.animation = "fadeToBlack 2s forwards";
  bodyEl.classList.remove("animate-glow");
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
}

function resetTimer() {
  pauseTimer();
  computeDuration();
  updateDisplay();

  mainContent.style.display = "flex";
  finalCountdown.textContent = "";
  finalCountdown.style.opacity = 0;
  finalCountdown.style.animation = "none";
  bodyEl.classList.remove("animate-glow");
}

document.addEventListener("keydown", e => {
  if (e.key === "s" || e.key === "S") startTimer();
  if (e.key === "p" || e.key === "P") pauseTimer();
  if (e.key === "r" || e.key === "R") resetTimer();
});

updateDisplay();
if (autoStart) startTimer();
</script>
</body>
</html>
